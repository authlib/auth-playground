---
name: tests
on:
  push:
    branches:
      - main
      - '*.*.*'
  pull_request:
    branches:
      - main
      - '*.*.*'

permissions:
  contents: read

jobs:
  tests:
    name: py${{ matrix.python }} unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python:
          - '3.15'
          - '3.14'
          - '3.13'
          - '3.12'
          - '3.11'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: |
          export TZ=UTC
          uv sync --all-extras
          uv run pytest --cov --cov-fail-under=100 --cov-report term-missing:skip-covered

  minversions:
    name: minimum dependency versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: '3.11'
      - name: Run tests
        run: |
          export TZ=UTC
          uv sync --all-extras --resolution=lowest-direct
          uv run --no-sync pytest

  style:
    name: style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Run prek
        run: |
          export TZ=UTC
          uv sync --all-extras
          uv run prek run --all-files

  commits:
    name: check commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Check each commit message
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          uv sync --only-group dev
          shas=$(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")
          status=0
          for sha in $shas; do
            echo "Checking commit $sha"
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/commit-msg"
            uv run --no-sync prek run --stage commit-msg --commit-msg-filename "$RUNNER_TEMP/commit-msg" || status=1
          done
          exit $status

  translations:
    name: verify translation catalogs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Extract translatable strings
        run: |
          uv sync --all-extras
          uv run prek run pybabel-extract --all-files
      - name: Check the catalog is up to date
        run: |
          git diff --no-ext-diff --cached --exit-code \
            -I '^"POT-Creation-Date:' -I '^"Generated-By:' -I '^#[:,]' \
            -- src/auth_playground/translations/messages.pot || {
            echo "The translation catalog is not up to date."
            echo "See the Translations section in README.md to update it."
            exit 1
          }

  vendor:
    name: check vendored front-end files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the vendored files match package-lock.json
        run: |
          npm ci
          npm run vendor
          if [ -n "$(git status --porcelain -- src/auth_playground/static/vendor)" ]; then
            git status --short -- src/auth_playground/static/vendor
            echo "The vendored files do not match package-lock.json."
            echo "Run 'npm ci && npm run vendor' and commit the result."
            exit 1
          fi

  bundle:
    name: binary bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Build binary
        run: |
          export TZ=UTC
          uv sync --group release --all-extras --no-dev
          uv run pyinstaller auth-playground.spec
      - name: Test binary
        run: |
          SECRET_KEY="test-secret-key-for-ci" FLASK_DEBUG="False" ./dist/auth-playground &
          pid=$!
          trap 'kill $pid' EXIT

          curl -fsSL --retry 30 --retry-delay 1 --retry-connrefused -o /dev/null http://localhost:4000/en/
          curl -fsSL -o /dev/null http://localhost:4000/fr/
          curl -fsSL -o /dev/null http://localhost:4000/static/vendor/pico/pico.min.css

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: auth-playground:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test Docker image
        run: |
          docker run -d --name test-app -p 4000:4000 \
            -e SECRET_KEY="test-secret-key-for-ci" \
            -e FLASK_DEBUG="False" \
            auth-playground:test

          timeout 30 sh -c 'until docker inspect --format="{{.State.Health.Status}}" test-app | grep -q "healthy"; do sleep 1; done' || {
            echo "Container failed to become healthy"
            docker logs test-app
            exit 1
          }

          for path in / /fr/ /static/vendor/pico/pico.min.css; do
            curl -fsSL -o /dev/null "http://localhost:4000$path" || {
              echo "App failed to respond on $path"
              docker logs test-app
              exit 1
            }
          done

          docker stop test-app
          docker rm test-app

  check:
    name: check
    if: always()
    needs:
      - tests
      - minversions
      - style
      - commits
      - translations
      - vendor
      - bundle
      - docker
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: commits
          jobs: ${{ toJSON(needs) }}
