---
name: tests
on:
  push:
    branches:
      - main
      - '*.*.*'
  pull_request:
    branches:
      - main
      - '*.*.*'
jobs:
  tests:
    name: py${{ matrix.python }} unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python:
          - '3.15'
          - '3.14'
          - '3.13'
          - '3.12'
          - '3.11'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: |
          export TZ=UTC
          uv sync --all-extras
          uv run pytest --cov --cov-fail-under=100 --cov-report term-missing:skip-covered

  minversions:
    name: minimum dependency versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: '3.11'
      - name: Run tests
        run: |
          export TZ=UTC
          uv sync --all-extras --resolution=lowest-direct
          uv run --no-sync pytest

  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Run tests
        run: |
          export TZ=UTC
          uv sync --all-extras
          uv run prek run --all-files

  translations:
    name: verify translation catalogs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Extract translatable strings
        run: |
          uv sync --all-extras
          uv run prek run pybabel-extract --all-files
      - name: Check the catalog is up to date
        run: |
          git diff --no-ext-diff --cached --exit-code \
            -I '^"POT-Creation-Date:' -I '^"Generated-By:' -I '^#[:,]' \
            -- src/auth_playground/translations/messages.pot || {
            echo "The translation catalog is not up to date."
            echo "See the Translations section in README.md to update it."
            exit 1
          }

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: |
          export TZ=UTC
          uv sync --group release --all-extras --no-dev
          uv run pyinstaller auth-playground.spec
          uv cache prune --ci
      - name: Test binary
        run: |
          SECRET_KEY="test-secret-key-for-ci" FLASK_DEBUG="False" ./dist/auth-playground &
          pid=$!
          trap 'kill $pid' EXIT

          curl -fsSL --retry 30 --retry-delay 1 --retry-connrefused -o /dev/null http://localhost:4000/en/
          curl -fsSL -o /dev/null http://localhost:4000/fr/

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: auth-playground:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test Docker image
        run: |
          docker run -d --name test-app -p 4000:4000 \
            -e SECRET_KEY="test-secret-key-for-ci" \
            -e FLASK_DEBUG="False" \
            auth-playground:test

          timeout 30 sh -c 'until docker inspect --format="{{.State.Health.Status}}" test-app | grep -q "healthy"; do sleep 1; done' || {
            echo "Container failed to become healthy"
            docker logs test-app
            exit 1
          }

          for path in / /fr/; do
            curl -fsSL -o /dev/null "http://localhost:4000$path" || {
              echo "App failed to respond on $path"
              docker logs test-app
              exit 1
            }
          done

          docker stop test-app
          docker rm test-app
