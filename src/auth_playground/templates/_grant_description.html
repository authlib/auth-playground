{% macro grant_description(grant) -%}
    <p class="grant-description">
        {{ grant.description }}
        {% for label, url in grant.references %}
            <a href="{{ url }}" target="_blank" rel="noopener noreferrer">{{ label }}</a>{% if not loop.last %} ·{% endif %}
        {% endfor %}
    </p>
{%- endmacro %}
